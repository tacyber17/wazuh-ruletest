[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuh-ruletest"
version = "0.1.0"
description = "Regression tests for Wazuh rules and decoders"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "YOUR NAME"}]
keywords = ["wazuh", "siem", "detection-engineering", "testing", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = ["requests>=2.28", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/tacyber17/wazuh-ruletest"
Issues = "https://github.com/tacyber17/wazuh-ruletest/issues"

[project.scripts]
wazuh-ruletest = "wazuh_ruletest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]